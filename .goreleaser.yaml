# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: tgcli

before:
  hooks:
    - go mod tidy

builds:
  - main: ./cmd/tgcli/
    binary: tgcli
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.ShortCommit}}
      - -X main.date={{.Date}}
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - format: tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        format: zip

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "^chore:"
      - "Merge pull request"

brews:
  - repository:
      owner: virat-mankali
      name: homebrew-tap
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    directory: Formula
    homepage: "https://github.com/virat-mankali/telegram-cli"
    description: "Blazing-fast terminal-based Telegram client built on MTProto"
    license: "MIT"
    install: |
      bin.install "tgcli"
    test: |
      system "#{bin}/tgcli", "--help"

release:
  github:
    owner: virat-mankali
    name: telegram-cli
  draft: false
  prerelease: auto
  name_template: "v{{ .Version }}"
